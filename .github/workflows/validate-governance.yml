# AI-SecOps governance CI — the schema + referential-integrity gate, plus the
# weakness sweep (scripts/weakness_sweep.py): secrets and TODO markers never
# ship in the governance corpus. Runs on every push/PR; red blocks merge.
name: validate-governance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Application regression tests (no live services)
        run: python -m pytest -q

      - name: Schema-validate every governance artifact
        run: |
          check-jsonschema --schemafile schemas/policy.schema.json                  policies/*.yaml
          check-jsonschema --schemafile schemas/exception.schema.json             exceptions/*.yaml
          check-jsonschema --schemafile schemas/risk.schema.json                  risks/*.yaml
          check-jsonschema --schemafile schemas/standard.schema.json              standards/*.yaml
          check-jsonschema --schemafile schemas/adr.schema.json                   architecture/*.yaml
          check-jsonschema --schemafile schemas/compensating-control.schema.json  controls/*.yaml

      - name: Referential integrity (all refs resolve)
        run: python scripts/check_references.py

      - name: Sweep self-test (detectors proven before they police)
        run: python scripts/weakness_sweep.py --self-test

      - name: Weakness sweep (secrets / TODOs in active artifacts)
        run: python scripts/weakness_sweep.py
